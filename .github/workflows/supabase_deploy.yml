name: Déploiement BDD Supabase (Migrations Automatiques)

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase_deploy.yml'
  workflow_dispatch:

jobs:
  deploy-database:
    name: 🚀 Appliquer les migrations Supabase
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ⚡ Installation de la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔗 Liaison du projet Supabase
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 📦 Application automatique des migrations (db push)
        run: |
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
