name: Ingestion & Analyse Quotidienne (Cron 08:00 UTC)

on:
  schedule:
    # Déclenchement automatique chaque jour à 08:00 UTC (10:00 heure de Paris en été, 09:00 en hiver)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Permet de lancer le job manuellement à tout moment depuis l'interface GitHub Actions
    inputs:
      mock_mode:
        description: 'Utiliser les données simulées (Mock) ?'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Mode Dry-Run (ne pas écrire dans Supabase) ?'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-daily-supervision:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Exécution du Runner Quotidien
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-pro' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GOOGLE_DELEGATED_USER_EMAIL: ${{ secrets.GOOGLE_DELEGATED_USER_EMAIL }}
          GMAIL_LABELS_FILTER: ${{ secrets.GMAIL_LABELS_FILTER || 'OneStock via RUN, Notification_DSI, OPCON, trt_stambia' }}
        run: |
          # Construction dynamique des arguments
          CMD="python backend/daily_runner.py"
          if [ "${{ inputs.mock_mode }}" = "true" ]; then
            CMD="$CMD --mock"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Exécution de : $CMD"
          eval $CMD
